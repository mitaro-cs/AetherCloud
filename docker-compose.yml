services:
  aethercloud:
    build: .
    container_name: aethercloud
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AETHER_HOST: 0.0.0.0
      AETHER_PORT: 5000
      AETHER_DEBUG: 0
      AETHER_DB_PATH: /data/users.db
      AETHER_STORAGE_DIR: /data/storage
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
